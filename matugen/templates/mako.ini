format=<b>%s</b>\n<span size="small">%b</span>
default-timeout=1500
on-button-left=dismiss
# OVERRIDES
background-color={{colors.surface.default.hex}}1a
text-color={{colors.on_surface.default.hex}}
border-color={{colors.outline.default.hex}}33
progress-color={{colors.primary.default.hex}}59

[app-name=hypr-anim]
