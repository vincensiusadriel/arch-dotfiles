# ==============================================================================
# 10. BATTERY MONITOR CUSTOM OSD (CENTER OVERLAY)
# ==============================================================================
[app-name="Battery Monitor"]
anchor=top-center
layer=overlay
width=260
height=60
margin=20,0,0,0
padding=8,12
border-size=2
border-radius=12
icons=1
max-icon-size=36
text-alignment=center
default-timeout=4000
background-color=#00000080
text-color=#ffffff
border-color=#ffffff33

[app-name="Battery Monitor" summary="Power Connected"]
background-color=#1b5e20b3
border-color=#4caf50ff
text-color=#e8f5e9

[app-name="Battery Monitor" summary="Battery Charged"]
background-color=#1b5e20b3
border-color=#4caf50ff
text-color=#e8f5e9

[app-name="Battery Monitor" summary="Power Disconnected"]
background-color=#b71c1cb3
border-color=#f44336ff
text-color=#ffebee

[app-name="Battery Monitor" summary="Battery Low"]
background-color=#e65100b3
border-color=#ff9800ff
text-color=#fff3e0

[app-name="Battery Monitor" summary="Battery Critical"]
