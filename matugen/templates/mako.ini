width=260
height=42
margin=0,0,30,0
padding=6,14
border-size=1
border-radius=20
icons=1
max-icon-size=20
icon-location=left
text-alignment=center
font=monospace 9.5
format=<b>%s</b>\n<span size="small">%b</span>
default-timeout=1500
on-button-left=dismiss
# OVERRIDES
background-color={{colors.surface.default.hex}}1a
